name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # core-cenf-py is a PRIVATE GitHub repo (CENFARG/core-cenf-py, isPrivate:true).
      # pip install resolves it via git+https, which needs authenticated git access.
      # The GIT_AUTH_TOKEN secret (PAT with read access to CENFARG/core-cenf-py)
      # MUST be configured on this repo (Settings -> Secrets and variables -> Actions).
      # Without it, this job FAILS at the pip install step. Expected on first run
      # until the secret is added — see openspec/changes/bootstrap-pip-package/tasks.md
      # Open Items.
      - name: Inject git credentials for private dependency
        run: |
          git config --global url."https://x-access-token:${{ secrets.GIT_AUTH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install package (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy src/yaml_agno

      - name: Run tests
        run: pytest -m "unit and not integration" -q

  # Integration job (PROPOSED): runs the L-03 JWT isolation integration suite
  # (tests/integration/ — self-contained: DevJwtIssuer + StaticReplyModel + tmp SQLite,
  # no external services). Locally validated: `python -m pytest -m integration -q` -> 7 passed.
  # The GitHub Actions runtime itself has NOT been executed (no CI validation available
  # from this environment). Not merged blindly: kept on feature/ci-l03-integration
  # until a maintainer runs CI once and confirms green.
  integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # Same private-dependency requirement as lint-test (core-cenf-py via git+https).
      - name: Inject git credentials for private dependency
        run: |
          git config --global url."https://x-access-token:${{ secrets.GIT_AUTH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install package (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run integration tests (L-03 JWT isolation)
        run: pytest -m integration -q
